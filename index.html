  .tprob { font-size: 22px; font-weight: 700; }
  .away .tprob { color: var(--away); } .home .tprob { color: var(--home); }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .axis { fill: var(--muted); font-size: 11px; }
  .tip { fill: var(--text); font-size: 12px; }
  .empty { text-align: center; padding: 60px 16px; color: var(--muted); max-width: 520px; margin: 0 auto; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 16px; margin: 16px; }

  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r[0] !== head[0]) // drop repeated header lines from appended runs
    .map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

let ALL = [];

function ingest(text) {
  ALL = parseCSV(text).map(r => ({
    t: new Date(r.timestamp.replace(" ", "T")),
    week: +r.week,
    key: r.away_team_id + "-" + r.home_team_id,
    away: r.away_team_name, home: r.home_team_name,
    ap: +r.away_points_live, hp: +r.home_points_live,
    aproj: +r.away_projected, hproj: +r.home_projected,
    aw: +r.away_win_probability, hw: +r.home_win_probability,
  })).filter(r => !isNaN(r.t) && !isNaN(r.aw) && !isNaN(r.hw));
  ALL.sort((a, b) => a.t - b.t);
  const weeks = [...new Set(ALL.map(r => r.week))].sort((a, b) => a - b);
  const sel = $("week");
  sel.innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join("");
  sel.value = weeks[weeks.length - 1];
  $("drop").hidden = true;
  $("controls").hidden = false;
  render();
}

const fmtTime = (d, withDay) => d.toLocaleString([], withDay
  ? { weekday: "short", hour: "numeric", minute: "2-digit" }
  : { hour: "numeric", minute: "2-digit" });

function el(name, attrs, parent) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function chart(pts, compress) {
  const W = 600, H = 230, L = 38, R = 12, T = 10, B = 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime();
  const n = pts.length;
  const xs = pts.map((p, i) => compress
    ? (n === 1 ? 0.5 : i / (n - 1))
    : (t1 === t0 ? 0.5 : (p.t - t0) / (t1 - t0)));
  const X = f => L + f * (W - L - R);
  const Y = v => T + (1 - v / 100) * (H - T - B);

  [0, 25, 50, 75, 100].forEach(v => {
    el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "var(--grid)",
                 "stroke-width": v === 50 ? 1.5 : 1, "stroke-dasharray": v === 50 ? "4 3" : "" }, svg);
    const tx = el("text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end", class: "axis" }, svg);
    tx.textContent = v + "%";
  });

  const sameDay = pts[0].t.toDateString() === pts[n - 1].t.toDateString();
  const ticks = Math.min(4, n);
  for (let k = 0; k < ticks; k++) {
    const f = ticks === 1 ? 0.5 : k / (ticks - 1);
    const idx = Math.round(f * (n - 1));
    const tx = el("text", { x: X(compress ? xs[idx] : f), y: H - 7, class: "axis",
      "text-anchor": k === 0 ? "start" : k === ticks - 1 ? "end" : "middle" }, svg);
    tx.textContent = fmtTime(compress ? pts[idx].t : new Date(t0 + f * (t1 - t0)), !sameDay);
  }

  const line = (sel, color) => {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(p[sel]).toFixed(1)}`).join("");
    el("path", { d: n === 1 ? d + "h0.1" : d, fill: "none", stroke: color, "stroke-width": 2.2,
                 "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  };
  line("aw", "var(--away)"); line("hw", "var(--home)");

  // Hover crosshair + tooltip
  const g = el("g", { visibility: "hidden" }, svg);
  const vl = el("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1 }, g);
  const da = el("circle", { r: 4, fill: "var(--away)" }, g);
  const dh = el("circle", { r: 4, fill: "var(--home)" }, g);
  const tipBg = el("rect", { rx: 6, fill: "var(--card)", stroke: "var(--border)" }, g);
  const tip = el("text", { class: "tip" }, g);
  const l1 = el("tspan", { x: 0, dy: 0 }, tip), l2 = el("tspan", { x: 0, dy: 15 }, tip),
        l3 = el("tspan", { x: 0, dy: 15 }, tip);

  const overlay = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, svg);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX);
    const f = ((cx - r.left) / r.width * W - L) / (W - L - R);
    let best = 0, bd = Infinity;
    xs.forEach((x, i) => { const d = Math.abs(x - f); if (d < bd) { bd = d; best = i; } });
    const p = pts[best], px = X(xs[best]);
    g.setAttribute("visibility", "visible");
    vl.setAttribute("x1", px); vl.setAttribute("x2", px);
    da.setAttribute("cx", px); da.setAttribute("cy", Y(p.aw));
    dh.setAttribute("cx", px); dh.setAttribute("cy", Y(p.hw));
    l1.textContent = p.t.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
    l2.textContent = `${p.away}: ${p.aw.toFixed(1)}%`;
    l3.textContent = `${p.home}: ${p.hw.toFixed(1)}%`;
    const w = Math.max(l1.getComputedTextLength?.() || 0, l2.getComputedTextLength?.() || 0,
                       l3.getComputedTextLength?.() || 0) + 16 || 150;
    const bx = px + 10 + w > W - R ? px - 10 - w : px + 10;
    tipBg.setAttribute("x", bx); tipBg.setAttribute("y", T + 4);
    tipBg.setAttribute("width", w); tipBg.setAttribute("height", 54);
    tip.setAttribute("transform", `translate(${bx + 8},${T + 20})`);
    [l1, l2, l3].forEach(s => s.setAttribute("x", 0));
  };
  overlay.addEventListener("mousemove", move);
  overlay.addEventListener("touchmove", move, { passive: true });
  overlay.addEventListener("touchstart", move, { passive: true });
  overlay.addEventListener("mouseleave", () => g.setAttribute("visibility", "hidden"));
  return svg;
}

function render() {
  const week = +$("week").value, compress = $("compress").checked;
  const rows = ALL.filter(r => r.week === week);
  const byKey = new Map();
  rows.forEach(r => { if (!byKey.has(r.key)) byKey.set(r.key, []); byKey.get(r.key).push(r); });

  const grid = $("grid"); grid.innerHTML = "";
  [...byKey.values()].forEach(pts => {
    const last = pts[pts.length - 1];
    const card = document.createElement("section"); card.className = "card";
    card.innerHTML = `
      <div class="teams">
        <div class="team away"><div class="tname"></div>
          <div class="tprob">${last.aw.toFixed(1)}%</div>
          <div class="tstats">${last.ap.toFixed(1)} pts · proj ${last.aproj.toFixed(1)}</div></div>
        <div class="team home"><div class="tname"></div>
          <div class="tprob">${last.hw.toFixed(1)}%</div>
          <div class="tstats">${last.hp.toFixed(1)} pts · proj ${last.hproj.toFixed(1)}</div></div>
      </div>`;
    card.querySelector(".away .tname").textContent = last.away;   // textContent: no HTML injection
    card.querySelector(".home .tname").textContent = last.home;
    card.appendChild(chart(pts, compress));
    grid.appendChild(card);
  });

  if (rows.length) {
    const a = rows[0].t, b = rows[rows.length - 1].t;
    $("sub").textContent = `${byKey.size} matchups · ${rows.length / byKey.size | 0} samples · ` +
      `${a.toLocaleString()} → ${b.toLocaleString()}`;
  }
}

function readFile(f) { if (f) f.text().then(ingest); }
$("file").onchange = e => readFile(e.target.files[0]);
$("file2").onchange = e => readFile(e.target.files[0]);
$("load").onclick = () => $("file2").click();
$("week").onchange = render;
$("compress").onchange = render;
["dragover", "dragenter"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
document.addEventListener("dragleave", () => $("drop").classList.remove("over"));
document.addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); readFile(e.dataTransfer.files[0]); });

if (EMBEDDED_CSV) ingest(EMBEDDED_CSV); else $("drop").hidden = false;
</script>
</body>
</html>
